name: rekorddart
description: A Dart library for accessing Rekordbox databases.
version: 2.0.1
repository: https://github.com/jeroen-meijer/rekorddart
license: MIT
topics:
  - music
  - dj
  - rekordbox
  - spotify

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  cli_table: ^1.0.2
  drift: ^2.35.4
  meta: ^1.19.0
  path: ^1.9.1
  sqlite3: ^3.9.1
  uuid: ^4.6.0
  xml: '>=6.6.1 <8.0.0'

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  lints: ^6.1.0
  test: ^1.33.0
  very_good_analysis: ^11.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

executables:
  download_key: download_key
