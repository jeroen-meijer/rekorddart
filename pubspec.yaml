name: rekorddart
description: A Dart library for accessing Rekordbox databases.
version: 1.1.1
repository: https://github.com/jeroen-meijer/rekorddart
license: MIT
topics:
  - music
  - dj
  - rekordbox
  - spotify

environment:
  sdk: '>=3.10.1 <4.0.0'

dependencies:
  cli_table: ^1.0.2
  drift: ^2.30.1
  meta: ^1.18.0
  path: ^1.9.1
  sqlite3: ^2.9.4
  uuid: ^4.5.2
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.30.1
  lints: ^6.0.0
  test: ^1.29.0
  very_good_analysis: ^10.0.0

executables:
  download_key: download_key
